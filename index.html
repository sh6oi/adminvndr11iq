<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>لوحة تحكم فندر - الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNdyY6TkU2aiblwWFG2zppasgqeBzhqyA",
            authDomain: "instashow-1f57f.firebaseapp.com",
            databaseURL: "https://instashow-1f57f-default-rtdb.firebaseio.com",
            projectId: "instashow-1f57f",
            storageBucket: "instashow-1f57f.firebasestorage.app",
            messagingSenderId: "265624874131",
            appId: "1:265624874131:web:64ab43a0783e1212a73166",
            measurementId: "G-D1BWXQX5VT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.firebaseApp = { app, db, ref, set, get, update, remove, onValue };
    </script>
    <style>
        :root {
            --white: #ffffff;
            --black: #0a0a0a;
            --gold: #f0b90b;
            --gold-dark: #c99a08;
            --gold-light: #fef9e7;
            --sky: #06b6d4;
            --sky-light: #e0f7fa;
            --danger: #ef4444;
            --success: #10b981;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --transition: 0.3s ease;
            --font: 'Tajawal', 'Segoe UI', 'Cairo', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--gray-50);
            color: var(--gray-900);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }

        #appScreen { display: block; min-height: 100vh; }

        .top-bar {
            background: var(--white);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gray-100);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-bar .brand { font-size: 22px; font-weight: 900; color: var(--black); }
        .top-bar .brand span { color: var(--gold); }

        .main-content {
            padding: 20px 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            border: 1px solid var(--gray-100);
        }

        .row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-100);
            flex-wrap: wrap;
            gap: 10px;
        }
        .row-item:last-child { border-bottom: none; }
        .row-info { flex: 2; min-width: 150px; }
        .row-info strong { font-size: 15px; display: block; }
        .row-info small { font-size: 12px; color: var(--gray-500); }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .status-preparing { background: #cffafe; color: #0e7490; }
        .status-uae { background: #ffedd5; color: #c2410c; }
        .status-iraq { background: #ede9fe; color: #6d28d9; }
        .status-delivered { background: #d1fae5; color: #047857; }

        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gold { background: var(--gold); color: var(--black); }
        .btn-outline { background: transparent; border: 1.5px solid var(--gray-300); color: var(--gray-700); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-sm { padding: 8px 16px; font-size: 12px; border-radius: 20px; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--gray-100);
        }
        .modal h3 { text-align: center; margin-bottom: 20px; font-weight: 800; }
        .modal .close-modal {
            float: left;
            background: var(--gray-100);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .input-group {
            position: relative;
            margin-bottom: 14px;
        }
        .input-group .icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--gray-400);
            pointer-events: none;
        }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 14px 44px 14px 16px;
            background: var(--gray-50);
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-xs);
            color: var(--gray-900);
            font-size: 14px;
            font-family: var(--font);
            transition: var(--transition);
            outline: none;
        }
        .input-group textarea { resize: vertical; min-height: 80px; }

        .radio-group { display: flex; gap: 10px; margin: 12px 0; }
        .radio-option {
            flex: 1; padding: 12px; background: var(--gray-50); border-radius: 8px;
            cursor: pointer; text-align: center; transition: var(--transition); border: 2px solid transparent;
        }
        .radio-option.selected { border-color: var(--gold); background: var(--gold-light); }
        .radio-option input { display: none; }

        #dupFields > div {
            display: flex; gap: 8px; margin-bottom: 10px; align-items: center;
        }
        #dupFields input {
            flex: 2; padding: 10px; border: 1px solid var(--gray-200); border-radius: 8px; font-family: var(--font);
        }
        #dupFields input[type="number"] { width: 80px; flex: 0 0 80px; }

        .search-box {
            margin-bottom: 16px;
            position: relative;
        }
        .search-box input {
            width: 100%; padding: 12px 16px; border: 2px solid var(--gray-200); border-radius: 30px;
            font-family: var(--font); font-size: 14px; outline: none; transition: var(--transition);
        }
        .search-box input:focus { border-color: var(--gold); }

        .detail-row {
            display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--gray-100);
            font-size: 14px;
        }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--black); color: var(--gold); padding: 12px 24px; border-radius: 30px;
            z-index: 999; font-weight: 700; white-space: nowrap; animation: slideUp 0.35s;
        }
        @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } }
        .toast.error { background: var(--danger); color: #fff; }
        .toast.success { background: var(--success); color: #fff; }

        #priceCalcResult {
            background: var(--gold-light);
            padding: 14px;
            border-radius: var(--radius-sm);
            margin: 12px 0;
            text-align: center;
            display: none;
        }
        #priceCalcResult.visible { display: block; }
        #priceCalcResult .iqd { font-size: 24px; font-weight: 900; color: var(--black); margin-bottom: 6px; }
        #priceCalcResult .down { font-size: 18px; font-weight: 700; color: var(--gold-dark); }
        #priceCalcResult .note { font-size: 12px; color: var(--gray-500); margin-top: 6px; }

        @media (max-width: 600px) {
            .row-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div id="appScreen">
        <div class="top-bar">
            <span class="brand">فن<span>در</span> | الإدارة</span>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline btn-sm" id="calcPriceBtn">🧮 حساب السعر</button>
            </div>
        </div>
        <div class="main-content">
            <!-- قسم الشحنات -->
            <div class="section-title">
                <span>📦 إدارة الشحنات</span>
                <button class="btn btn-gold btn-sm" id="addShipmentBtn">➕ إضافة شحنة جديدة</button>
            </div>
            <div id="shipmentsContainer" class="card" style="padding:12px 16px; margin-bottom:32px;">

            </div>

            <!-- قسم الطلبات -->

                <span>🛒 الطلبات</span>

                <div style="text-align:center; color:var(--gray-400); padding:20px;">جاري تحميل الطلبات...</div>

    <!-- نافذة إضافة/تعديل شحنة -->
    <div id="shipmentModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <button class="close-modal" id="closeShipmentModal">✕</button>
            <h3 id="shipmentModalTitle">➕ شحنة جديدة</h3>

                        <option value="قيد الشحن للعراق">قيد الشحن للعراق</option>
                        <option value="تم التسليم">تم التسليم</option>

            <form id="orderForm">
                <input type="hidden" id="orderId">

                    <span class="icon">📦</span>

                        <option value="">اختر رقم الشحنة المرتبط</option>

                </div>
                <!-- حقل رابط الانستغرام -->

                    <span class="icon">🌐</span>
                    <input type="url" id="instagramLink" placeholder="رابط حساب الانستغرام (مثل: https://instagram.com/username)">

    <!-- نافذة عرض تفاصيل الطلب -->
    <div id="detailModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <button class="close-modal" id="closeDetailModal">✕</button>
            <h3>📋 تفاصيل الطلب</h3>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- نافذة حاسبة السعر -->
    <div id="calcPriceModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <button class="close-modal" id="closeCalcPrice">✕</button>
            <h3>🧮 حساب السعر</h3>
            <div class="input-group" style="margin-bottom:12px;">
                <span class="icon">💵</span>
                <input type="number" id="priceUSD" placeholder="السعر بالدولار ($)" step="0.01" min="0" autofocus>
            </div>
            <div id="priceCalcResult"></div>
            <button class="btn btn-gold" id="calcPriceBtnModal" style="width:100%;">احسب</button>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script type="module">
        const { db, ref, set, get, update, remove, onValue } = window.firebaseApp;
        let allShipments = [];
        let allOrders = [];
        let editingShipmentId = null;
        let editingOrderId = null;

        // ---------- دوال مساعدة ----------
        function showToast(msg, type='') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = msg;
            document.getElementById('toastContainer').appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function extractUrl(text) {
            if (!text) return '';
            const match = text.match(/https?:\/\/[^\s]+/);
            return match ? match[0] : text;
        }

        // دالة لتنظيف رابط الانستغرام (تأكد من وجود https://)
        function cleanInstagramLink(value) {
            if (!value) return '';
            let url = value.trim();
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }
            return url;
        }

        function setupLinkCleaner(input, isInstagram = false) {
            input.addEventListener('input', function() {
                let val = this.value;
                if (isInstagram) {
                    val = cleanInstagramLink(val);
                } else {
                    val = extractUrl(val);
                }
                if (val !== this.value) this.value = val;
            });
            input.addEventListener('blur', function() {
                let val = this.value;
                if (isInstagram) {
                    val = cleanInstagramLink(val);
                } else {
                    val = extractUrl(val);
                }
                if (val !== this.value) this.value = val;
            });
        }

        function getStatusClass(status) {
            if (!status) return '';
            if (status.includes('تجهيز')) return 'status-preparing';
            if (status.includes('الإمارات')) return 'status-uae';
            if (status.includes('العراق')) return 'status-iraq';
            if (status.includes('تسليم')) return 'status-delivered';
            return '';
        }

        // دالة التقريب الجديدة: تقريب إلى أقرب ألف بحد أدنى 750 للصعود
        function roundToNearestThousand(value) {
            if (!value) return 0;
            const remainder = value % 1000;
            if (remainder >= 750) {
                return value + (1000 - remainder);
            } else {
                return value - remainder;
            }
        }

        // حساب العربون بناءً على السعر المقرب
        function calculateDownPayment(totalIQD) {
            const rounded = roundToNearestThousand(totalIQD);
            if (rounded < 100000) return 10000;
            if (rounded <= 250000) return 25000;
            if (rounded <= 500000) return 50000;
            return 100000;
        }

        // ---------- تحميل البيانات ----------
        function loadShipments() {
            onValue(ref(db, 'shipments'), (snap) => {
                allShipments = [];
                if (snap.exists()) {
                    Object.entries(snap.val()).forEach(([id, val]) => {
                        allShipments.push({ id, ...val });
                    });
                }
                renderShipments();
                populateShipmentSelect();
            });
        }

        function loadOrders() {
            onValue(ref(db, 'orders'), (snap) => {
                allOrders = [];
                if (snap.exists()) {
                    Object.entries(snap.val()).forEach(([id, val]) => {
                        allOrders.push({ id, ...val });
                    });
                }
                renderOrders();
            });
        }

        // ---------- عرض الشحنات ----------
        function renderShipments() {
            const container = document.getElementById('shipmentsContainer');
            if (allShipments.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--gray-400); padding:20px;">لا توجد شحنات</div>';
                return;
            }
            container.innerHTML = allShipments.map(ship => `
                <div class="row-item">
                    <div class="row-info">
                        <strong>${ship.shipmentNumber}</strong>
                    </div>
                    <span class="status-badge ${getStatusClass(ship.status)}">${ship.status || '—'}</span>
                    <div style="display:flex; gap:6px;">
                        <button class="btn btn-outline btn-sm edit-shipment-btn" data-id="${ship.id}">✏️ تعديل</button>
                        <button class="btn btn-danger btn-sm delete-shipment-btn" data-id="${ship.id}">🗑️ حذف</button>
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('.edit-shipment-btn').forEach(btn => {
                btn.addEventListener('click', () => openEditShipment(btn.dataset.id));
            });
            container.querySelectorAll('.delete-shipment-btn').forEach(btn => {
                btn.addEventListener('click', () => deleteShipment(btn.dataset.id));
            });
        }

        function populateShipmentSelect() {
            const select = document.getElementById('orderShipmentSelect');
            select.innerHTML = '<option value="">اختر رقم الشحنة المرتبط</option>';
            allShipments.forEach(ship => {
                const option = document.createElement('option');
                option.value = ship.shipmentNumber;
                option.textContent = ship.shipmentNumber;
                select.appendChild(option);
            });
        }

        // ---------- نافذة الشحنة ----------
        const shipmentModal = document.getElementById('shipmentModal');
        const shipmentForm = document.getElementById('shipmentForm');
        const shipmentNumberInput = document.getElementById('shipmentNumber');
        const shipmentStatusSelect = document.getElementById('shipmentStatus');
        const shipmentIdInput = document.getElementById('shipmentId');
        const shipmentModalTitle = document.getElementById('shipmentModalTitle');

        document.getElementById('addShipmentBtn').addEventListener('click', () => {
            editingShipmentId = null;
            shipmentModalTitle.textContent = '➕ شحنة جديدة';
            shipmentForm.reset();
            shipmentIdInput.value = '';
            shipmentNumberInput.disabled = false;
            shipmentModal.style.display = 'flex';
        });

        document.getElementById('closeShipmentModal').addEventListener('click', () => {
            shipmentModal.style.display = 'none';
        });

        function openEditShipment(shipmentId) {
            const ship = allShipments.find(s => s.id === shipmentId);
            if (!ship) return;
            editingShipmentId = shipmentId;
            shipmentModalTitle.textContent = '✏️ تعديل الشحنة';
            shipmentIdInput.value = shipmentId;
            shipmentNumberInput.value = ship.shipmentNumber;
            shipmentNumberInput.disabled = true;
            shipmentStatusSelect.value = ship.status || 'قيد التجهيز';
            shipmentModal.style.display = 'flex';
        }

        shipmentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const number = shipmentNumberInput.value.trim();
            if (!number) { showToast('رقم الشحنة مطلوب', 'error'); return; }
            const status = shipmentStatusSelect.value;

            if (editingShipmentId) {
                await update(ref(db, 'shipments/' + editingShipmentId), { status });
                showToast('✅ تم تحديث الحالة', 'success');
            } else {
                const exists = allShipments.some(s => s.shipmentNumber === number);
                if (exists) {
                    showToast('⚠️ رقم الشحنة موجود مسبقاً', 'error');
                    return;
                }
                const newShipmentRef = ref(db, 'shipments/' + number);
                await set(newShipmentRef, {
                    shipmentNumber: number,
                    status: status,
                    createdAt: new Date().toISOString()
                });
                showToast('✅ تمت إضافة الشحنة', 'success');
            }
            shipmentModal.style.display = 'none';
        });

        async function deleteShipment(shipmentId) {
            if (!confirm('هل أنت متأكد من حذف هذه الشحنة؟ قد تبقى الطلبات المرتبطة بها بدون شحنة.')) return;
            await remove(ref(db, 'shipments/' + shipmentId));
            showToast('🗑️ تم حذف الشحنة', 'success');
        }

        // ---------- عرض الطلبات مع البحث ----------
        function renderOrders(filterText = '') {
            const container = document.getElementById('ordersContainer');
            let filteredOrders = allOrders;
            if (filterText.trim()) {
                const term = filterText.trim().toLowerCase();
                filteredOrders = allOrders.filter(order => 
                    (order.shipmentNumber || '').toLowerCase().includes(term)
                );
            }

            if (filteredOrders.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--gray-400); padding:20px;">لا توجد طلبات مطابقة</div>';
                return;
            }

            container.innerHTML = filteredOrders.map(order => {
                const shipStatus = getShipmentStatus(order.shipmentNumber);
                let instaDisplay = order.instagramLink || '—';
                if (instaDisplay.length > 30) {
                    instaDisplay = instaDisplay.substring(0, 30) + '…';
                }
                return `
                <div class="row-item order-row-clickable" data-id="${order.id}" style="cursor:pointer;">
                    <div class="row-info">
                        <strong>${instaDisplay} | ${order.phone1 || '—'}</strong>
                        <small>🚚 شحنة: ${order.shipmentNumber || '—'} 
                        ${shipStatus ? `<span class="status-badge ${getStatusClass(shipStatus)}">${shipStatus}</span>` : ''}
                        </small>
                        <small>📍 ${order.governorate || ''} ${order.address ? '- ' + order.address.substring(0, 25) : ''}</small>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button class="btn btn-outline btn-sm edit-order-btn" data-id="${order.id}">✏️ تعديل</button>
                        <button class="btn btn-danger btn-sm delete-order-btn" data-id="${order.id}">🗑️ حذف</button>
                    </div>
                </div>`;
            }).join('');

            container.querySelectorAll('.order-row-clickable').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    showOrderDetail(row.dataset.id);
                });
            });

            container.querySelectorAll('.edit-order-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditOrder(btn.dataset.id);
                });
            });
            container.querySelectorAll('.delete-order-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteOrder(btn.dataset.id);
                });
            });
        }

        function getShipmentStatus(shipmentNumber) {
            const ship = allShipments.find(s => s.shipmentNumber === shipmentNumber);
            return ship ? ship.status : null;
        }

        document.getElementById('searchShipmentInput').addEventListener('input', (e) => {
            renderOrders(e.target.value);
        });

        // ---------- نافذة إضافة/تعديل طلب ----------
        const orderModal = document.getElementById('orderModal');
        const orderForm = document.getElementById('orderForm');
        const orderModalTitle = document.getElementById('orderModalTitle');
        const orderIdInput = document.getElementById('orderId');
        const dupRadioGroup = document.getElementById('dupRadioGroup');
        const dupContainer = document.getElementById('duplicateProductsContainer');
        const dupFields = document.getElementById('dupFields');
        const addDupRowBtn = document.getElementById('addDupRow');

        function resetOrderForm() {
            orderForm.reset();
            orderIdInput.value = '';
            document.querySelector('input[name="hasDuplicates"][value="no"]').checked = true;
            document.querySelectorAll('#dupRadioGroup .radio-option').forEach(o => o.classList.remove('selected'));
            document.querySelector('#dupRadioGroup .radio-option[data-val="no"]').classList.add('selected');
            dupContainer.style.display = 'none';
            dupFields.innerHTML = '';
            addDuplicateRow();
            populateShipmentSelect();
            document.getElementById('cartPrice').value = '';
            document.getElementById('instagramLink').value = '';
        }

        function addDuplicateRow(link = '', qty = 1) {
            const row = document.createElement('div');
            row.innerHTML = `
                <input type="text" class="dup-link" placeholder="رابط المنتج" value="${link}">
                <input type="number" class="dup-qty" placeholder="العدد" value="${qty}" min="1" style="width:80px;">
                <button type="button" class="btn btn-danger btn-sm remove-dup">🗑️</button>
            `;
            dupFields.appendChild(row);
            const linkInput = row.querySelector('.dup-link');
            setupLinkCleaner(linkInput);
            row.querySelector('.remove-dup').addEventListener('click', () => row.remove());
        }

        addDupRowBtn.addEventListener('click', () => addDuplicateRow());

        dupRadioGroup.addEventListener('click', (e) => {
            const opt = e.target.closest('.radio-option');
            if (!opt) return;
            document.querySelectorAll('#dupRadioGroup .radio-option').forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            opt.querySelector('input').checked = true;
            dupContainer.style.display = opt.dataset.val === 'yes' ? 'block' : 'none';
        });

        document.getElementById('addOrderBtn').addEventListener('click', () => {
            editingOrderId = null;
            orderModalTitle.textContent = '➕ طلب جديد';
            resetOrderForm();
            orderModal.style.display = 'flex';
        });

        document.getElementById('closeOrderModal').addEventListener('click', () => {
            orderModal.style.display = 'none';
        });

        function openEditOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            editingOrderId = orderId;
            orderModalTitle.textContent = '✏️ تعديل الطلب';
            resetOrderForm();
            orderIdInput.value = orderId;
            document.getElementById('instagramLink').value = order.instagramLink || '';
            document.getElementById('phone1').value = order.phone1 || '';
            document.getElementById('phone2').value = order.phone2 || '';
            document.getElementById('governorate').value = order.governorate || '';
            document.getElementById('address').value = order.address || '';
            document.getElementById('cartLink').value = order.cartLink || '';
            document.getElementById('cartPrice').value = order.cartPrice || '';
            const shipmentSelect = document.getElementById('orderShipmentSelect');
            if (order.shipmentNumber) {
                shipmentSelect.value = order.shipmentNumber;
            }

            const hasDup = order.hasDuplicates && order.duplicateProducts && order.duplicateProducts.length > 0;
            document.querySelector('input[name="hasDuplicates"][value="' + (hasDup ? 'yes' : 'no') + '"]').checked = true;
            document.querySelectorAll('#dupRadioGroup .radio-option').forEach(o => {
                o.classList.remove('selected');
                if (o.dataset.val === (hasDup ? 'yes' : 'no')) o.classList.add('selected');
            });
            dupContainer.style.display = hasDup ? 'block' : 'none';
            dupFields.innerHTML = '';
            if (hasDup) {
                order.duplicateProducts.forEach(p => addDuplicateRow(p.link || '', p.quantity || 1));
            } else {
                addDuplicateRow();
            }
            orderModal.style.display = 'flex';
        }

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const shipmentNumber = document.getElementById('orderShipmentSelect').value;
            if (!shipmentNumber) { showToast('يجب اختيار رقم الشحنة', 'error'); return; }

            const cartPrice = parseFloat(document.getElementById('cartPrice').value);
            if (isNaN(cartPrice) || cartPrice <= 0) {
                showToast('⚠️ يجب إدخال سعر السلة بالدينار (أكبر من صفر)', 'error');
                document.getElementById('cartPrice').focus();
                return;
            }

            const instagramLink = document.getElementById('instagramLink').value.trim();
            const cleanedInstagram = instagramLink ? cleanInstagramLink(instagramLink) : '';

            const hasDuplicates = document.querySelector('input[name="hasDuplicates"]:checked')?.value === 'yes';
            const duplicateProducts = [];
            if (hasDuplicates) {
                const rows = dupFields.querySelectorAll('div');
                rows.forEach(row => {
                    const link = row.querySelector('.dup-link')?.value?.trim();
                    const qty = parseInt(row.querySelector('.dup-qty')?.value) || 1;
                    if (link) duplicateProducts.push({ link: extractUrl(link), quantity: qty });
                });
            }

            const orderData = {
                shipmentNumber,
                instagramLink: cleanedInstagram,
                phone1: document.getElementById('phone1').value.trim(),
                phone2: document.getElementById('phone2').value.trim(),
                governorate: document.getElementById('governorate').value,
                address: document.getElementById('address').value.trim(),
                cartLink: extractUrl(document.getElementById('cartLink').value.trim()),
                cartPrice: cartPrice,
                hasDuplicates,
                duplicateProducts,
                updatedAt: new Date().toISOString()
            };

            try {
                if (editingOrderId) {
                    await update(ref(db, 'orders/' + editingOrderId), orderData);
                    showToast('✅ تم تحديث الطلب', 'success');
                } else {
                    const newOrderRef = ref(db, 'orders/' + generateOrderKey());
                    orderData.createdAt = new Date().toISOString();
                    await set(newOrderRef, orderData);
                    showToast('✅ تم إضافة الطلب', 'success');
                }
                orderModal.style.display = 'none';
            } catch (err) {
                console.error(err);
                showToast('❌ حدث خطأ', 'error');
            }
        });

        function generateOrderKey() {
            return 'ORD-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
        }

        async function deleteOrder(orderId) {
            if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
            await remove(ref(db, 'orders/' + orderId));
            showToast('🗑️ تم حذف الطلب', 'success');
        }

        // ---------- نافذة تفاصيل الطلب ----------
        const detailModal = document.getElementById('detailModal');
        document.getElementById('closeDetailModal').addEventListener('click', () => {
            detailModal.style.display = 'none';
        });

        function showOrderDetail(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const shipStatus = getShipmentStatus(order.shipmentNumber) || '—';
            let dupHtml = '';
            if (order.hasDuplicates && order.duplicateProducts?.length) {
                dupHtml = '<div style="margin-top:8px;"><strong>📋 منتجات مكررة:</strong><ul style="padding-right:20px;">';
                order.duplicateProducts.forEach(p => {
                    dupHtml += `<li><a href="${p.link}" target="_blank">${p.link}</a> (العدد: ${p.quantity})</li>`;
                });
                dupHtml += '</ul></div>';
            }
            const priceIQD = order.cartPrice || 0;
            const instaLink = order.instagramLink ? `<a href="${order.instagramLink}" target="_blank">${order.instagramLink}</a>` : '—';
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-row"><span>📦 الشحنة</span><span>${order.shipmentNumber || '—'} 
                    <span class="status-badge ${getStatusClass(shipStatus)}">${shipStatus}</span></span></div>
                <div class="detail-row"><span>🌐 رابط الانستغرام</span><span>${instaLink}</span></div>
                <div class="detail-row"><span>📞 الهاتف 1</span><span>${order.phone1 || '—'}</span></div>
                <div class="detail-row"><span>📱 الهاتف 2</span><span>${order.phone2 || '—'}</span></div>
                <div class="detail-row"><span>📍 المحافظة</span><span>${order.governorate || '—'}</span></div>
                <div class="detail-row"><span>🏠 العنوان</span><span>${order.address || '—'}</span></div>
                <div class="detail-row"><span>🔗 رابط السلة</span><span><a href="${order.cartLink}" target="_blank">${order.cartLink || '—'}</a></span></div>
                <div class="detail-row"><span>💰 سعر السلة</span><span>${priceIQD.toLocaleString()} د.ع</span></div>
                ${dupHtml}
                <div class="detail-row"><span>📅 تاريخ الإضافة</span><span>${order.createdAt ? new Date(order.createdAt).toLocaleString('ar-IQ') : '—'}</span></div>
            `;
            detailModal.style.display = 'flex';
        }

        // ---------- حاسبة السعر (مع التقريب الجديد) ----------
        const calcPriceModal = document.getElementById('calcPriceModal');
        const calcPriceBtn = document.getElementById('calcPriceBtn');
        const closeCalcPrice = document.getElementById('closeCalcPrice');
        const priceUSDInput = document.getElementById('priceUSD');
        const priceCalcResult = document.getElementById('priceCalcResult');
        const calcPriceBtnModal = document.getElementById('calcPriceBtnModal');

        calcPriceBtn.addEventListener('click', () => {
            calcPriceModal.style.display = 'flex';
            priceUSDInput.value = '';
            priceCalcResult.classList.remove('visible');
            priceCalcResult.innerHTML = '';
            setTimeout(() => priceUSDInput.focus(), 300);
        });

        closeCalcPrice.addEventListener('click', () => {
            calcPriceModal.style.display = 'none';
        });

        calcPriceModal.addEventListener('click', (e) => {
            if (e.target === calcPriceModal) calcPriceModal.style.display = 'none';
        });

        calcPriceBtnModal.addEventListener('click', () => {
            const usd = parseFloat(priceUSDInput.value);
            if (!usd || usd <= 0) {
                showToast('⚠️ أَدخل سعراً صحيحاً بالدولار', 'error');
                priceUSDInput.focus();
                return;
            }
            const iqd = Math.floor(usd * 1320);
            // تطبيق التقريب الجديد
            const roundedIQD = roundToNearestThousand(iqd);
            const downPayment = calculateDownPayment(iqd); // يستخدم نفس التقريب داخلياً

            priceCalcResult.classList.add('visible');
            priceCalcResult.innerHTML = `
                <div class="iqd">💰 السعر بالدينار (مقرب): ${roundedIQD.toLocaleString()} د.ع</div>
                <div class="down">🔐 العربون المطلوب: ${downPayment.toLocaleString()} د.ع</div>
                <div class="note">* التقريب حسب القاعدة: إذا كانت المئات >= 750 يصعد، وإلا ينزل</div>
            `;
        });

        priceUSDInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                calcPriceBtnModal.click();
            }
        });

        // بدء التطبيق
        const instagramInput = document.getElementById('instagramLink');
        setupLinkCleaner(instagramInput, true);

        const cartLinkInput = document.getElementById('cartLink');
        setupLinkCleaner(cartLinkInput);

        addDuplicateRow();
        loadShipments();
        loadOrders();
    </script>
</body>
</html>
