<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - فندر | Admin</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNdyY6TkU2aiblwWFG2zppasgqeBzhqyA",
            authDomain: "instashow-1f57f.firebaseapp.com",
            databaseURL: "https://instashow-1f57f-default-rtdb.firebaseio.com",
            projectId: "instashow-1f57f",
            storageBucket: "instashow-1f57f.firebasestorage.app",
            messagingSenderId: "265624874131",
            appId: "1:265624874131:web:64ab43a0783e1212a73166",
            measurementId: "G-D1BWXQX5VT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        window.firebaseAdmin = { app, auth, db, ref, set, get, update, remove, onValue, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut };
    </script>
    <style>
        :root {
            --white: #ffffff;
            --black: #0a0a0a;
            --gold: #f0b90b;
            --gold-dark: #c99a08;
            --gold-light: #fef9e7;
            --sky: #06b6d4;
            --sky-light: #e0f7fa;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --danger: #ef4444;
            --success: #10b981;
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', 'Tajawal', 'Cairo', system-ui, sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font);
            background: var(--gray-50);
            color: var(--gray-900);
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }

        #adminAuthScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        #adminAuthScreen.hidden { display:none; }
        .auth-container { background: var(--white); border-radius: 28px; padding:40px 30px; width:100%; max-width:420px; box-shadow: var(--shadow-lg); border:1px solid var(--gray-200); }
        .auth-logo { text-align:center; margin-bottom:30px; }
        .auth-logo h1 { font-size:28px; font-weight:800; color:var(--black); }
        .auth-logo h1 span { color:var(--gold); }
        .input-group { margin-bottom:14px; }
        .input-group input { width:100%; padding:14px 16px; background:var(--gray-50); border:1.5px solid var(--gray-200); border-radius: var(--radius-xs); color:var(--black); font-size:14px; outline:none; font-family:var(--font); }
        .btn { padding:14px 24px; border-radius:30px; font-weight:700; font-size:15px; cursor:pointer; border:none; transition:var(--transition); display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font); }
        .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color:var(--black); box-shadow:0 6px 20px rgba(240,185,11,0.3); }
        .btn-gold:hover { transform:translateY(-2px); }
        .btn-black { background:var(--black); color:var(--gold); }
        .btn-outline { background:transparent; border:1.5px solid var(--gray-300); color:var(--gray-700); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-sm { padding:10px 18px; font-size:13px; border-radius:24px; }

        #adminAppScreen { display:none; }
        #adminAppScreen.active { display:block; }
        .top-nav { background:var(--white); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--gray-100); position:sticky; top:0; z-index:100; box-shadow:var(--shadow-sm); }
        .top-nav .brand { font-size:20px; font-weight:800; color:var(--black); }
        .top-nav .brand span { color:var(--gold); }
        .menu-toggle { background:var(--gray-100); border:none; color:var(--black); font-size:22px; cursor:pointer; padding:10px 14px; border-radius:var(--radius-xs); }

        .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:200; display:none; }
        .sidebar-overlay.open { display:block; }
        .sidebar { position:fixed; top:0; right:-300px; width:280px; height:100vh; background:var(--white); z-index:201; transition:right 0.3s; padding:20px; display:flex; flex-direction:column; border-left:1px solid var(--gray-100); overflow-y:auto; box-shadow:var(--shadow-lg); }
        .sidebar.open { right:0; }
        .side-menu { list-style:none; flex:1; }
        .side-menu li { padding:14px 16px; border-radius:var(--radius-xs); cursor:pointer; display:flex; align-items:center; gap:10px; color:var(--gray-600); transition:var(--transition); margin-bottom:4px; font-weight:500; }
        .side-menu li:hover, .side-menu li.active { background:var(--gray-100); color:var(--gold); font-weight:700; }
        .side-menu .logout-item { margin-top:auto; color:var(--danger); border-top:1px solid var(--gray-100); padding-top:16px; }

        .main-content { padding:20px; max-width:1000px; margin:0 auto; }
        .page-section { display:none; animation:fadeSlide 0.3s ease; }
        .page-section.active { display:block; }
        @keyframes fadeSlide { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        .card { background:var(--white); border-radius:var(--radius); padding:24px; border:1px solid var(--gray-100); box-shadow:var(--shadow-sm); margin-bottom:20px; }
        .card-header { font-size:18px; font-weight:700; margin-bottom:18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:12px; margin-bottom:20px; }
        .stat-card { background:var(--gray-50); border-radius:var(--radius-sm); padding:18px; text-align:center; border:1px solid var(--gray-100); }
        .stat-num { font-size:30px; font-weight:800; color:var(--gold); }

        .badge { padding:5px 12px; border-radius:16px; font-size:10px; font-weight:700; }
        .badge-review { background:#fef3c7; color:#b45309; }
        .badge-payment { background:#dbeafe; color:#1d4ed8; }
        .badge-audit { background:#ede9fe; color:#6d28d9; }
        .badge-process { background:#cffafe; color:#0e7490; }
        .badge-shipping { background:#ffedd5; color:#c2410c; }
        .badge-delivered { background:#d1fae5; color:#047857; }
        .badge-cancelled { background:#fee2e2; color:#dc2626; }

        .table-row { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--white); border-radius:var(--radius-sm); margin-bottom:8px; border:1px solid var(--gray-100); transition:var(--transition); gap:10px; flex-wrap:wrap; cursor:pointer; }
        .table-row:hover { border-color:var(--gold); transform:translateY(-2px); box-shadow:var(--shadow); }

        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
        .modal { background:var(--white); border-radius:var(--radius); padding:24px; width:100%; max-width:550px; max-height:90vh; overflow-y:auto; border:1px solid var(--gray-100); box-shadow:var(--shadow-lg); }
        .modal h3 { color:var(--black); text-align:center; margin-bottom:18px; font-weight:800; }
        .modal input, .modal select { width:100%; padding:12px 14px; background:var(--gray-50); border:1.5px solid var(--gray-200); border-radius:8px; color:var(--black); margin-bottom:10px; font-family:var(--font); }
        .detail-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--gray-100); font-size:14px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:var(--black); color:var(--gold); padding:14px 28px; border-radius:30px; z-index:999; font-weight:700; animation:slideUp 0.3s; }
        @keyframes slideUp { from{opacity:0; transform:translateX(-50%) translateY(20px);} }
    </style>
</head>
<body>
    <div id="adminAuthScreen">
        <div class="auth-container">
            <div class="auth-logo"><h1>فن<span>در</span> | الإدارة</h1></div>
            <div id="adminAuthError" style="color:#dc2626; text-align:center; margin-bottom:10px; display:none;"></div>
            <form id="adminLoginForm">
                <div class="input-group"><input type="email" id="adminEmail" placeholder="admin@vender.com" value="admin@vender.com" required></div>
                <div class="input-group"><input type="password" id="adminPass" placeholder="كلمة المرور" value="545454" required></div>
                <button type="submit" class="btn btn-black" style="width:100%;">تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <div id="adminAppScreen">
        <nav class="top-nav">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <span class="brand">فن<span>در</span> | لوحة التحكم</span>
            <span style="width:40px;"></span>
        </nav>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="side-header"><span style="font-weight:800; font-size:18px; color:var(--gold);">القائمة</span><button id="closeSide" style="background:none;border:none;color:var(--gray-500);font-size:20px;">✕</button></div>
            <ul class="side-menu">
                <li class="active" data-page="orders">📦 إدارة الطلبات</li>
                <li data-page="shipments">🚚 إدارة الشحنات</li>
                <li data-page="users">👥 إدارة المستخدمين</li>
                <li class="logout-item" id="adminLogoutBtn">🚪 تسجيل الخروج</li>
            </ul>
        </aside>
        <div class="main-content">
            <section class="page-section active" id="pageOrders">
                <div class="stats-grid" id="orderStats"></div>
                <div class="card">
                    <div class="card-header">📦 الطلبات
                        <input type="text" id="searchOrderInput" placeholder="🔍 بحث برقم الطلب..." style="flex:1; max-width:250px; padding:10px 14px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:30px; font-family:var(--font);">
                        <select id="filterShipmentSelect" style="padding:10px 14px; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:30px; font-family:var(--font); max-width:180px;">
                            <option value="">🚚 كل الشحنات</option>
                        </select>
                    </div>
                    <div id="ordersContainer"></div>
                </div>
            </section>
            <section class="page-section" id="pageShipments">
                <div class="card">
                    <div class="card-header">🚚 الشحنات <button class="btn btn-gold btn-sm" id="addShipmentBtn" style="margin-right:auto;">➕ إضافة شحنة</button></div>
                    <div id="shipmentsContainer"></div>
                </div>
            </section>
            <section class="page-section" id="pageUsers">
                <div class="card"><div class="card-header">👥 المستخدمين</div><div id="usersContainer"></div></div>
            </section>
        </div>
    </div>

    <!-- مودالات -->
    <div id="priceModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closePriceModal">✕</button><h3>💰 تسعير الطلب</h3><div id="priceModalContent"></div></div></div>
    <div id="editOrderModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closeEditOrder">✕</button><h3>✏️ تعديل طلب</h3><div id="editOrderContent"></div></div></div>
    <div id="detailOrderModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closeDetailOrder">✕</button><h3>📋 تفاصيل</h3><div id="detailOrderContent"></div></div></div>
    <div id="shipmentModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closeShipmentModal">✕</button><h3>🚚 شحنة</h3><div id="shipmentModalContent"></div></div></div>
    <div id="editUserModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closeEditUser">✕</button><h3>✏️ تعديل المستخدم</h3><div id="editUserContent"></div></div></div>
    <div id="toastContainer"></div>

    <script type="module">
        const { auth, db, ref, set, get, update, remove, onValue, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } = window.firebaseAdmin;
        const ADMIN_EMAIL = 'admin@vender.com';
        const ADMIN_PASSWORD = '545454';
        let currentAdmin = null;
        let allOrders = [], allShipments = [], allUsers = [];
        let searchTerm = '', filterShipmentId = '';

        function floorToThousand(v) { return v ? Math.floor(v/1000)*1000 : 0; }
        function calculateDownPayment(totalIQD) {
            const t = floorToThousand(totalIQD);
            if (t < 100000) return 10000;
            if (t <= 250000) return 25000;
            if (t <= 500000) return 50000;
            return 100000;
        }
        function showToast(msg, type='') { const t = document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.getElementById('toastContainer').appendChild(t); setTimeout(()=> t.remove(), 2500); }
        function getBadge(s) { const m = {'قيد المراجعة':'badge-review','بانتظار الدفع':'badge-payment','قيد التدقيق':'badge-audit','قيد التجهيز':'badge-process','قيد الشحن للكويت':'badge-shipping','قيد الشحن للعراق':'badge-shipping','تم التسليم':'badge-delivered','ملغي':'badge-cancelled'}; return m[s]||'badge-review'; }

        // Auth
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value;
            try {
                if(email===ADMIN_EMAIL && pass===ADMIN_PASSWORD) {
                    try{ await signInWithEmailAndPassword(auth, email, pass); }
                    catch(err){ if(err.code==='auth/user-not-found') await createUserWithEmailAndPassword(auth, email, pass); }
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch(err) { document.getElementById('adminAuthError').style.display='block'; document.getElementById('adminAuthError').textContent = 'خطأ: '+err.message; }
        });

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                const isDefault = user.email === ADMIN_EMAIL;
                if(isDefault) {
                    const uref = ref(db, 'users/'+user.uid);
                    const snap = await get(uref);
                    if(!snap.exists()) await set(uref, { name:'مدير النظام', email:ADMIN_EMAIL, isAdmin:true, createdAt: new Date().toISOString() });
                    else if(!snap.val().isAdmin) await update(uref, { isAdmin:true });
                }
                currentAdmin = user;
                document.getElementById('adminAuthScreen').classList.add('hidden');
                document.getElementById('adminAppScreen').classList.add('active');
                loadData();
                navigateTo('orders');
            } else {
                document.getElementById('adminAuthScreen').classList.remove('hidden');
                document.getElementById('adminAppScreen').classList.remove('active');
            }
        });

        function loadData() {
            onValue(ref(db, 'orders'), snap => {
                allOrders = [];
                if(snap.exists()) Object.entries(snap.val()).forEach(([k,v]) => allOrders.push({id:k, ...v}));
                allOrders.sort((a,b)=> new Date(b.createdAt||0) - new Date(a.createdAt||0));
                renderOrders();
                updateStats();
                populateShipmentFilter();
            });
            onValue(ref(db, 'shipments'), snap => {
                allShipments = [];
                if(snap.exists()) Object.entries(snap.val()).forEach(([k,v]) => allShipments.push({id:k, ...v}));
                renderShipments();
                populateShipmentFilter();
            });
            onValue(ref(db, 'users'), snap => {
                allUsers = [];
                if(snap.exists()) Object.entries(snap.val()).forEach(([k,v]) => allUsers.push({id:k, ...v}));
                renderUsers();
            });
        }

        function updateStats() {
            document.getElementById('orderStats').innerHTML = `
                <div class="stat-card"><div class="stat-num">${allOrders.length}</div><div>الكل</div></div>
                <div class="stat-card"><div class="stat-num">${allOrders.filter(o=>o.status==='قيد المراجعة').length}</div><div>مراجعة</div></div>
                <div class="stat-card"><div class="stat-num">${allOrders.filter(o=>o.status==='بانتظار الدفع').length}</div><div>انتظار دفع</div></div>
                <div class="stat-card"><div class="stat-num">${allOrders.filter(o=>o.status==='قيد التجهيز').length}</div><div>تجهيز</div></div>
            `;
        }

        function populateShipmentFilter() {
            const select = document.getElementById('filterShipmentSelect');
            if(!select) return;
            select.innerHTML = '<option value="">🚚 كل الشحنات</option>';
            allShipments.forEach(s => { select.innerHTML += `<option value="${s.id}">${s.number||s.id}</option>`; });
            select.value = filterShipmentId;
            select.onchange = () => { filterShipmentId = select.value; renderOrders(); };
        }

        // Navigation
        document.getElementById('menuToggle').onclick = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); };
        document.getElementById('closeSide').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); };
        document.getElementById('sidebarOverlay').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); };
        document.querySelectorAll('.side-menu li[data-page]').forEach(li => li.addEventListener('click', ()=> {
            navigateTo(li.dataset.page);
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
        }));
        document.getElementById('adminLogoutBtn').onclick = async () => { await signOut(auth); };

        function navigateTo(page) {
            document.querySelectorAll('.page-section').forEach(s=>s.classList.remove('active'));
            document.getElementById('page'+(page==='orders'?'Orders':page==='shipments'?'Shipments':'Users')).classList.add('active');
            document.querySelectorAll('.side-menu li').forEach(l=>l.classList.remove('active'));
            document.querySelector(`.side-menu li[data-page="${page}"]`).classList.add('active');
            if(page==='orders') { renderOrders(); populateShipmentFilter(); }
            if(page==='shipments') renderShipments();
            if(page==='users') renderUsers();
        }

        // Orders
        document.getElementById('searchOrderInput').addEventListener('input', function() { searchTerm = this.value; renderOrders(); });

        function getFilteredOrders() {
            let filtered = allOrders;
            if(searchTerm) filtered = filtered.filter(o => (o.orderNumber||o.id).toLowerCase().includes(searchTerm.toLowerCase()));
            if(filterShipmentId) filtered = filtered.filter(o => o.shipmentId === filterShipmentId);
            return filtered;
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const orders = getFilteredOrders();
            if(!orders.length) { container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--gray-400);">لا توجد طلبات</div>'; return; }
            container.innerHTML = orders.map(order => {
                const badge = getBadge(order.status);
                const shipment = allShipments.find(s => s.id === order.shipmentId);
                return `
                <div class="table-row" data-id="${order.id}">
                    <div style="flex:1;">
                        <div><strong>${order.orderNumber||order.id}</strong> <span class="badge ${badge}">${order.status||'?'}</span></div>
                        <div style="font-size:11px; color:var(--gray-500);">${order.userEmail||''} | ${shipment ? '🚚 '+shipment.number : ''}</div>
                    </div>
                    <div style="display:flex; gap:6px;">
                        ${order.status==='قيد المراجعة'?`<button class="btn btn-gold btn-sm price-btn" data-id="${order.id}">💲 تسعير</button>`:''}
                        <button class="btn btn-outline btn-sm edit-btn" data-id="${order.id}">✏️</button>
                        <button class="btn btn-danger btn-sm delete-btn" data-id="${order.id}">🗑️</button>
                    </div>
                </div>`;
            }).join('');
            container.querySelectorAll('.table-row').forEach(row => row.addEventListener('click', (e) => {
                if(e.target.closest('button')) return;
                openDetailModal(row.dataset.id);
            }));
            container.querySelectorAll('.price-btn').forEach(b => b.addEventListener('click', (e)=> { e.stopPropagation(); openPriceModal(b.dataset.id); }));
            container.querySelectorAll('.edit-btn').forEach(b => b.addEventListener('click', (e)=> { e.stopPropagation(); openEditOrderModal(b.dataset.id); }));
            container.querySelectorAll('.delete-btn').forEach(b => b.addEventListener('click', (e)=> { e.stopPropagation(); deleteOrder(b.dataset.id); }));
        }

        function openPriceModal(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if(!order) return;
            const userOrders = allOrders.filter(o => o.userId === order.userId && o.id !== orderId && o.status !== 'ملغي');
            const isFirstOrder = userOrders.length === 0;
            document.getElementById('priceModalContent').innerHTML = `
                <p><strong>${order.orderNumber}</strong> | ${order.userEmail}</p>
                <input type="number" id="priceUSDInput" placeholder="السعر بالدولار" step="0.01" min="0">
                <div id="pricePreview" class="highlight-box" style="display:none; background:var(--gold-light); padding:14px; border-radius:8px; margin:10px 0;">
                    <p>💵 بالدينار: <span id="calcIQD">—</span> د.ع (×1280)</p>
                    <p>🚚 التوصيل: <span id="calcDelivery">—</span> د.ع ${isFirstOrder?'<span style="color:var(--success);">(مجاني - أول طلب)</span>':''}</p>
                    <p>📊 المجموع: <span id="calcTotal">—</span> د.ع</p>
                    <p>🔐 العربون: <span id="calcDownPayment" style="color:var(--gold);font-size:17px;">—</span> د.ع</p>
                </div>
                <button class="btn btn-gold" id="confirmPriceBtn" disabled>✅ تأكيد التسعير</button>
            `;
            document.getElementById('priceModal').style.display = 'flex';
            const priceInput = document.getElementById('priceUSDInput');
            const preview = document.getElementById('pricePreview');
            const confirmBtn = document.getElementById('confirmPriceBtn');
            priceInput.addEventListener('input', () => {
                const usd = parseFloat(priceInput.value);
                if(isNaN(usd) || usd <= 0) { preview.style.display = 'none'; confirmBtn.disabled = true; return; }
                preview.style.display = 'block';
                const iqd = floorToThousand(usd * 1280);
                let delivery = 3000;
                if(isFirstOrder || usd > 200) delivery = 0;
                const total = iqd + delivery;
                const downPayment = calculateDownPayment(total);
                document.getElementById('calcIQD').textContent = iqd.toLocaleString();
                document.getElementById('calcDelivery').textContent = delivery.toLocaleString();
                document.getElementById('calcTotal').textContent = total.toLocaleString();
                document.getElementById('calcDownPayment').textContent = downPayment.toLocaleString();
                confirmBtn.disabled = false;
                confirmBtn.onclick = async () => {
                    await update(ref(db, 'orders/'+orderId), { priceUSD:usd, priceIQD:iqd, deliveryFee:delivery, totalIQD:total, downPayment:downPayment, status:'بانتظار الدفع', pricedAt:new Date().toISOString(), isFirstOrder });
                    document.getElementById('priceModal').style.display = 'none';
                    showToast('✅ تم التسعير', 'success');
                };
            });
        }
        document.getElementById('closePriceModal').onclick = () => document.getElementById('priceModal').style.display = 'none';

        function openEditOrderModal(orderId) {
            const order = allOrders.find(o=>o.id===orderId);
            if(!order) return;
            const statuses = ['قيد المراجعة','بانتظار الدفع','قيد التدقيق','قيد التجهيز','قيد الشحن للكويت','قيد الشحن للعراق','تم التسليم','ملغي'];
            const shipmentOptions = allShipments.map(s => `<option value="${s.id}" ${order.shipmentId===s.id?'selected':''}>${s.number||s.id}</option>`).join('');
            document.getElementById('editOrderContent').innerHTML = `
                <input type="text" id="editCartLink" value="${order.cartLink||''}" placeholder="رابط السلة">
                <div style="display:flex; gap:8px;">
                    <input type="number" id="editPriceUSD" value="${order.priceUSD||''}" placeholder="سعر $" style="flex:1;">
                    <input type="number" id="editPriceIQD" value="${order.priceIQD||''}" placeholder="سعر د.ع" style="flex:1;">
                </div>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="editDelivery" value="${order.deliveryFee||''}" placeholder="توصيل" style="flex:1;">
                    <input type="number" id="editDownPayment" value="${order.downPayment||''}" placeholder="عربون" style="flex:1;">
                </div>
                <select id="editStatus">${statuses.map(s=>`<option value="${s}" ${order.status===s?'selected':''}>${s}</option>`).join('')}</select>
                <label>رقم الشحنة</label>
                <select id="editShipmentSelect"><option value="">-- بدون شحنة --</option>${shipmentOptions}</select>
                <button class="btn btn-gold" id="saveEditOrderBtn" style="width:100%; margin-top:10px;">حفظ</button>
            `;
            document.getElementById('editOrderModal').style.display = 'flex';
            document.getElementById('saveEditOrderBtn').onclick = async () => {
                const newStatus = document.getElementById('editStatus').value;
                const priceIQD = parseInt(document.getElementById('editPriceIQD').value) || null;
                const deliveryFee = parseInt(document.getElementById('editDelivery').value) || null;
                const totalIQD = (priceIQD!==null && deliveryFee!==null) ? priceIQD + deliveryFee : order.totalIQD;
                const updates = {
                    cartLink: document.getElementById('editCartLink').value,
                    priceUSD: parseFloat(document.getElementById('editPriceUSD').value)||null,
                    priceIQD, deliveryFee,
                    downPayment: parseInt(document.getElementById('editDownPayment').value)||null,
                    totalIQD,
                    status: newStatus,
                    shipmentId: document.getElementById('editShipmentSelect').value || null
                };
                if(newStatus === 'قيد التجهيز' && totalIQD && updates.downPayment) {
                    updates.remainingAmount = floorToThousand(totalIQD - updates.downPayment);
                }
                await update(ref(db, 'orders/'+orderId), updates);
                document.getElementById('editOrderModal').style.display = 'none';
                showToast('تم التحديث');
            };
        }
        document.getElementById('closeEditOrder').onclick = () => document.getElementById('editOrderModal').style.display='none';

        function openDetailModal(orderId) {
            const order = allOrders.find(o=>o.id===orderId);
            if(!order) return;
            const shipment = allShipments.find(s=>s.id===order.shipmentId);
            document.getElementById('detailOrderContent').innerHTML = `
                <div class="detail-row"><span>الطلب</span><span>${order.orderNumber}</span></div>
                <div class="detail-row"><span>الحالة</span><span class="badge ${getBadge(order.status)}">${order.status}</span></div>
                <div class="detail-row"><span>الشحنة</span><span>${shipment ? shipment.number : '—'}</span></div>
                <div class="detail-row"><span>رابط السلة</span><span><a href="${order.cartLink}" target="_blank">${order.cartLink||'—'}</a></span></div>
            `;
            document.getElementById('detailOrderModal').style.display = 'flex';
        }
        document.getElementById('closeDetailOrder').onclick = () => document.getElementById('detailOrderModal').style.display='none';

        async function deleteOrder(orderId) { if(confirm('حذف؟')) { await remove(ref(db, 'orders/'+orderId)); showToast('تم الحذف'); } }

        // Shipments
        function renderShipments() {
            const container = document.getElementById('shipmentsContainer');
            if(!allShipments.length) { container.innerHTML = '<div style="text-align:center; padding:30px;">لا توجد شحنات</div>'; return; }
            container.innerHTML = allShipments.map(s => `
                <div class="table-row">
                    <div><strong>${s.number||s.id}</strong> <span class="badge ${getBadge(s.status)}">${s.status}</span></div>
                    <button class="btn btn-outline btn-sm edit-shipment-btn" data-id="${s.id}">✏️ تعديل الحالة</button>
                </div>
            `).join('');
            container.querySelectorAll('.edit-shipment-btn').forEach(b => b.addEventListener('click', () => openShipmentModal(b.dataset.id)));
        }

        document.getElementById('addShipmentBtn').addEventListener('click', () => openShipmentModal(null));

        function openShipmentModal(shipmentId) {
            const shipment = shipmentId ? allShipments.find(s=>s.id===shipmentId) : null;
            document.getElementById('shipmentModalContent').innerHTML = `
                <input type="text" id="shipNumber" placeholder="رقم الشحنة" value="${shipment?.number||''}" required>
                <select id="shipStatus">
                    <option value="قيد التجهيز" ${shipment?.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option>
                    <option value="قيد الشحن للكويت" ${shipment?.status==='قيد الشحن للكويت'?'selected':''}>قيد الشحن للكويت</option>
                    <option value="قيد الشحن للعراق" ${shipment?.status==='قيد الشحن للعراق'?'selected':''}>قيد الشحن للعراق</option>
                    <option value="تم التسليم" ${shipment?.status==='تم التسليم'?'selected':''}>تم التسليم</option>
                </select>
                <button class="btn btn-gold" id="saveShipmentBtn" style="width:100%;">حفظ</button>
            `;
            document.getElementById('shipmentModal').style.display = 'flex';
            document.getElementById('saveShipmentBtn').onclick = async () => {
                const number = document.getElementById('shipNumber').value.trim();
                const status = document.getElementById('shipStatus').value;
                if(!number) return;
                if(shipmentId) {
                    await update(ref(db, 'shipments/'+shipmentId), { number, status });
                    const ordersToUpdate = allOrders.filter(o=>o.shipmentId===shipmentId);
                    for(const o of ordersToUpdate) await update(ref(db, 'orders/'+o.id), { status });
                } else {
                    await set(ref(db, 'shipments/'+number), { number, status });
                }
                document.getElementById('shipmentModal').style.display = 'none';
                showToast('تم الحفظ');
            };
        }
        document.getElementById('closeShipmentModal').onclick = () => document.getElementById('shipmentModal').style.display='none';

        // Users
        function renderUsers() {
            const container = document.getElementById('usersContainer');
            if(!allUsers.length) { container.innerHTML = '<p style="text-align:center;color:var(--gray-400);">لا يوجد مستخدمين</p>'; return; }
            container.innerHTML = allUsers.map(u => `
                <div class="table-row">
                    <div><strong>${u.name||'—'}</strong> (${u.email||''}) ${u.banned?'<span style="color:var(--danger);">🚫</span>':''} ${u.isAdmin?'<span style="color:var(--gold);">🛡️</span>':''}</div>
                    <button class="btn btn-outline btn-sm edit-user-btn" data-id="${u.id}">✏️ تعديل كامل</button>
                </div>
            `).join('');
            container.querySelectorAll('.edit-user-btn').forEach(b => b.addEventListener('click', () => openEditUser(b.dataset.id)));
        }

        function openEditUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if(!user) return;
            document.getElementById('editUserContent').innerHTML = `
                <label>الاسم الكامل</label>
                <input type="text" id="euName" value="${user.name||''}">
                <label>البريد الإلكتروني</label>
                <input type="email" id="euEmail" value="${user.email||''}">
                <label>رقم الهاتف الأول</label>
                <input type="tel" id="euPhone1" value="${user.phone1||''}">
                <label>رقم الهاتف الثاني</label>
                <input type="tel" id="euPhone2" value="${user.phone2||''}">
                <label>المحافظة</label>
                <input type="text" id="euProvince" value="${user.province||''}">
                <label>العنوان</label>
                <input type="text" id="euAddress" value="${user.address||''}">
                <div style="display:flex; gap:20px; margin-top:10px;">
                    <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" id="euIsAdmin" ${user.isAdmin?'checked':''}> مدير</label>
                    <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" id="euBanned" ${user.banned?'checked':''}> محظور</label>
                </div>
                <button class="btn btn-gold" id="saveUserBtn" style="width:100%; margin-top:14px;">💾 حفظ التعديلات</button>
            `;
            document.getElementById('editUserModal').style.display = 'flex';
            document.getElementById('saveUserBtn').onclick = async () => {
                const updates = {
                    name: document.getElementById('euName').value.trim(),
                    email: document.getElementById('euEmail').value.trim(),
                    phone1: document.getElementById('euPhone1').value.trim(),
                    phone2: document.getElementById('euPhone2').value.trim(),
                    province: document.getElementById('euProvince').value.trim(),
                    address: document.getElementById('euAddress').value.trim(),
                    isAdmin: document.getElementById('euIsAdmin').checked,
                    banned: document.getElementById('euBanned').checked
                };
                await update(ref(db, 'users/'+userId), updates);
                document.getElementById('editUserModal').style.display = 'none';
                showToast('✅ تم تحديث بيانات المستخدم', 'success');
            };
        }
        document.getElementById('closeEditUser').onclick = () => document.getElementById('editUserModal').style.display = 'none';
    </script>
</body>
</html>
