    <div id="priceModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closePriceModal">✕</button><h3>💰 تسعير الطلب</h3><div id="priceModalContent"></div></div></div>
    <div id="editOrderModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closeEditOrderModal">✕</button><h3>✏️ تعديل الطلب</h3><div id="editOrderContent"></div></div></div>
    <div id="detailOrderModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closeDetailOrderModal">✕</button><h3>📋 تفاصيل الطلب الكاملة</h3><div id="detailOrderContent"></div></div></div>
    <div id="editUserModal" class="modal-overlay" style="display:none;"><div class="modal"><button class="close-modal" id="closeEditUserModal">✕</button><h3>✏️ تعديل المستخدم</h3><div id="editUserContent"></div></div></div>
    <div id="toastContainer"></div>

    <script type="module">
        const { auth, db, ref, set, get, update, remove, onValue, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } = window.firebaseAdmin;
        const ADMIN_EMAIL = 'admin@vender.com';
        const ADMIN_PASSWORD = '545454';

        let currentAdmin = null;
        let allOrders = [];
        let allUsers = [];

        // دالة تقريب المبلغ لأقرب ألف (بدون كسور)
        function floorToThousand(amount) {
            if (amount == null || isNaN(amount)) return 0;
            return Math.floor(amount / 1000) * 1000;
        }

        // دالة تنسيق المبلغ لعرضه بدون كسور
        function formatIQD(amount) {
            if (amount == null) return '—';
            const floored = floorToThousand(amount);
            return floored.toLocaleString() + ' د.ع';
        }

        // حساب العربون بناءً على الشرائح (باستخدام مبلغ مقرب لأقرب ألف)
        function calculateDownPayment(totalIQD) {
            const t = floorToThousand(totalIQD);
            if (t < 100000) return 10000;
            if (t <= 250000) return 25000;
            if (t <= 500000) return 50000;
            return 100000;
        }

        function showToast(msg, type = '') {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; t.style.transition = '0.4s'; setTimeout(() => t.remove(), 400); }, 2800);
        }

        const adminAuthScreen = document.getElementById('adminAuthScreen');
        const adminAppScreen = document.getElementById('adminAppScreen');
        const adminAuthError = document.getElementById('adminAuthError');
        const adminLoginForm = document.getElementById('adminLoginForm');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuToggle = document.getElementById('menuToggle');
        const closeSide = document.getElementById('closeSide');
        const ordersContainer = document.getElementById('ordersContainer');
        const usersContainer = document.getElementById('usersContainer');
        const priceModal = document.getElementById('priceModal');
        const priceModalContent = document.getElementById('priceModalContent');
        const editOrderModal = document.getElementById('editOrderModal');
        const editOrderContent = document.getElementById('editOrderContent');
        const detailOrderModal = document.getElementById('detailOrderModal');
        const detailOrderContent = document.getElementById('detailOrderContent');
        const editUserModal = document.getElementById('editUserModal');
        const editUserContent = document.getElementById('editUserContent');

        // ==================== AUTH ====================
        adminLoginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            adminAuthError.style.display = 'none';
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value;
            if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
                try { await signInWithEmailAndPassword(auth, email, pass); } catch (err) { if (err.code === 'auth/user-not-found') await createUserWithEmailAndPassword(auth, email, pass); }
                return;
            }
            try {
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                const snap = await get(ref(db, 'users/' + cred.user.uid));
                if (!snap.exists() || !snap.val().isAdmin) { await signOut(auth); adminAuthError.textContent = '⛔ ليس لديك صلاحية المدير'; adminAuthError.style.display = 'block'; }
            } catch (err) { adminAuthError.textContent = '⚠️ ' + err.message; adminAuthError.style.display = 'block'; }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isDefaultAdmin = user.email === ADMIN_EMAIL;
                if (isDefaultAdmin) {
                    const uref = ref(db, 'users/' + user.uid);
                    const snap = await get(uref);
                    if (!snap.exists()) await set(uref, { name: 'مدير النظام', email: ADMIN_EMAIL, isAdmin: true, createdAt: new Date().toISOString() });
                    else if (!snap.val().isAdmin) await update(uref, { isAdmin: true });
                    currentAdmin = user;
                    showAdminApp();
                } else {
                    const snap = await get(ref(db, 'users/' + user.uid));
                    if (snap.exists() && snap.val().isAdmin) { currentAdmin = user; showAdminApp(); }
                    else { await signOut(auth); showAdminAuth(); }
                }
            } else { if (!localStorage.getItem('vndr_admin_session')) showAdminAuth(); }
        });

        function showAdminApp() {
            adminAuthScreen.classList.add('hidden');
            adminAppScreen.classList.add('active');
            localStorage.setItem('vndr_admin_session', JSON.stringify({ email: currentAdmin?.email }));
            loadAllData();
            navigateTo('orders');
        }
        function showAdminAuth() {
            adminAuthScreen.classList.remove('hidden');
            adminAppScreen.classList.remove('active');
            localStorage.removeItem('vndr_admin_session');
            currentAdmin = null;
        }

        // ==================== SIDEBAR ====================
        menuToggle.addEventListener('click', () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('open'); });
        closeSide.addEventListener('click', () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); });
        sidebarOverlay.addEventListener('click', () => { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); });
        document.querySelectorAll('.side-menu li[data-page]').forEach(li => {
            li.addEventListener('click', () => { navigateTo(li.dataset.page); sidebar.classList.remove('open'); sidebarOverlay.classList.remove('open'); });
        });
        function navigateTo(page) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
            document.querySelectorAll('.side-menu li').forEach(l => l.classList.remove('active'));
            document.querySelector(`.side-menu li[data-page="${page}"]`).classList.add('active');
            if (page === 'orders') renderOrders();
            if (page === 'users') renderUsers();
        }
        document.getElementById('adminLogoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            localStorage.removeItem('vndr_admin_session');
            showAdminAuth();
            showToast('تم تسجيل الخروج', 'success');
        });

        // ==================== DATA ====================
        function loadAllData() {
            onValue(ref(db, 'orders'), (snap) => {
                allOrders = [];
                if (snap.exists()) { const data = snap.val(); for (const [key, val] of Object.entries(data)) allOrders.push({ id: key, ...val }); }
                allOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                renderOrders();
                updateStats();
            });
            onValue(ref(db, 'users'), (snap) => {
                allUsers = [];
                if (snap.exists()) { const data = snap.val(); for (const [key, val] of Object.entries(data)) allUsers.push({ id: key, ...val }); }
                renderUsers();
            });
        }
        function updateStats() {
            document.getElementById('orderStats').innerHTML = `
                <div class="stat-card"><div class="stat-num">${allOrders.length}</div><div class="stat-label">الكل</div></div>
                <div class="stat-card"><div class="stat-num">${allOrders.filter(o=>o.status==='قيد المراجعة').length}</div><div class="stat-label">قيد المراجعة</div></div>
                <div class="stat-card"><div class="stat-num">${allOrders.filter(o=>o.status==='بانتظار الدفع').length}</div><div class="stat-label">بانتظار الدفع</div></div>
                <div class="stat-card"><div class="stat-num">${allOrders.filter(o=>o.status==='قيد التدقيق').length}</div><div class="stat-label">قيد التدقيق</div></div>
                <div class="stat-card"><div class="stat-num">${allOrders.filter(o=>o.status==='قيد التجهيز').length}</div><div class="stat-label">قيد التجهيز</div></div>
            `;
        }
        function formatDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('ar-IQ', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
        function getBadgeClass(s) { const m={'قيد المراجعة':'badge-review','بانتظار الدفع':'badge-payment','قيد التدقيق':'badge-audit','قيد التجهيز':'badge-process','قيد الشحن للكويت':'badge-shipping','قيد الشحن للعراق':'badge-shipping','تم التسليم':'badge-delivered','ملغي':'badge-cancelled','ملغي لان عملية تحويل الاموال غير صالحة':'badge-cancelled'}; return m[s]||'badge-review'; }

        function renderOrders() {
            if (!allOrders.length) { ordersContainer.innerHTML = '<div style="text-align:center;color:var(--text3);padding:30px;">لا توجد طلبات</div>'; return; }
            let html = '';
            allOrders.forEach(order => {
                const isPending = order.status === 'قيد المراجعة';
                html += `
                <div class="order-row ${isPending?'pending-highlight':''}" data-id="${order.id}">
                    <div style="flex:1;">
                        <strong style="color:var(--gold);">${order.orderNumber||order.id}</strong>
                        <div style="font-size:11px;color:var(--text3);">${order.userEmail||'—'} | ${formatDate(order.createdAt)}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                        <span class="badge ${getBadgeClass(order.status)}">${order.status||'قيد المراجعة'}</span>
                        ${isPending ? `<button class="btn btn-gold btn-sm price-btn" data-id="${order.id}">💲 تسعير</button>` : ''}
                    </div>
                </div>`;
            });
            ordersContainer.innerHTML = html;
            ordersContainer.querySelectorAll('.order-row').forEach(row => {
                row.addEventListener('click', function(e) { if (e.target.closest('button')) return; openDetailModal(this.dataset.id); });
            });
            ordersContainer.querySelectorAll('.price-btn').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); openPriceModal(b.dataset.id); }));
        }

        // ==================== DETAIL MODAL (مع رابط السلة والمنتجات المكررة والأسعار المقربة) ====================
        function openDetailModal(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const badgeClass = getBadgeClass(order.status);
            let dupHtml = '';
            if (order.hasDuplicates && order.duplicateProducts && order.duplicateProducts.length > 0) {
                dupHtml = `<div class="highlight-box"><strong>📋 المنتجات المكررة (${order.duplicateProducts.length}):</strong>`;
                order.duplicateProducts.forEach((dp, i) => {
                    dupHtml += `<div class="link-item">🔹 <a href="${dp.link}" target="_blank">${dp.link}</a> <span style="color:var(--text3);">| العدد: ${dp.quantity}</span></div>`;
                });
                dupHtml += `</div>`;
            }
            const remaining = order.remainingAmount != null ? order.remainingAmount : (order.status === 'قيد التجهيز' && order.totalIQD && order.downPayment ? floorToThousand(order.totalIQD - order.downPayment) : null);
            detailOrderContent.innerHTML = `
                <div class="detail-row"><span class="dl">🔖 رقم الطلب</span><span class="dv">${order.orderNumber||order.id}</span></div>
                <div class="detail-row"><span class="dl">📊 الحالة</span><span class="dv"><span class="badge ${badgeClass}">${order.status||'—'}</span></span></div>
                <div class="detail-row"><span class="dl">📅 التاريخ</span><span class="dv">${formatDate(order.createdAt)}</span></div>
                <div class="detail-row"><span class="dl">👤 المستخدم</span><span class="dv">${order.userEmail||'—'}</span></div>
                <div class="detail-row">
                    <span class="dl">🔗 رابط السلة</span>
                    <span class="dv"><a href="${order.cartLink}" target="_blank" style="color:var(--accent2); word-break:break-all;">${order.cartLink||'—'}</a></span>
                </div>
                ${dupHtml}
                <div class="detail-row"><span class="dl">💵 سعر $</span><span class="dv">${order.priceUSD||'—'}</span></div>
                <div class="detail-row"><span class="dl">💵 سعر د.ع</span><span class="dv">${formatIQD(order.priceIQD)}</span></div>
                <div class="detail-row"><span class="dl">🚚 توصيل</span><span class="dv">${formatIQD(order.deliveryFee)}</span></div>
                <div class="detail-row"><span class="dl">📊 الإجمالي</span><span class="dv" style="color:var(--gold);">${formatIQD(order.totalIQD)}</span></div>
                <div class="detail-row"><span class="dl">🔐 العربون</span><span class="dv">${formatIQD(order.downPayment)}</span></div>
                ${remaining != null ? `<div class="detail-row"><span class="dl">💸 المتبقي</span><span class="dv" style="color:var(--success);">${formatIQD(remaining)}</span></div>` : ''}
                <div class="detail-row"><span class="dl">💳 الدفع</span><span class="dv">${order.paymentMethod==='zaincash'?'📱 زين كاش':order.paymentMethod==='rafidain'?'🏦 الرافدين':'—'}</span></div>
                ${order.paymentScreenshot ? `<div style="margin-top:10px;"><strong>📸 صورة التحويل:</strong><br><img src="${order.paymentScreenshot}" style="max-width:100%;max-height:200px;border-radius:8px;margin-top:6px;"></div>` : ''}
                <div style="margin-top:15px;display:flex;gap:8px;">
                    <button class="btn btn-outline btn-sm" id="detailEditBtn">✏️ تعديل الطلب</button>
                    <button class="btn btn-danger btn-sm" id="detailDeleteBtn">🗑️ حذف</button>
                </div>
            `;
            detailOrderModal.style.display = 'flex';
            document.getElementById('detailEditBtn').onclick = () => { detailOrderModal.style.display = 'none'; openEditOrderModal(orderId); };
            document.getElementById('detailDeleteBtn').onclick = async () => { if (!confirm('حذف الطلب؟')) return; await remove(ref(db, 'orders/' + orderId)); detailOrderModal.style.display = 'none'; showToast('🗑️ تم الحذف'); };
        }
        document.getElementById('closeDetailOrderModal').addEventListener('click', () => detailOrderModal.style.display = 'none');
        detailOrderModal.addEventListener('click', (e) => { if (e.target === detailOrderModal) detailOrderModal.style.display = 'none'; });

        // ==================== PRICE MODAL (تقريب المبالغ لأقرب ألف) ====================
        function openPriceModal(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const userOrders = allOrders.filter(o => o.userId === order.userId && o.id !== orderId && o.status !== 'ملغي');
            const isFirstOrder = userOrders.length === 0;

            priceModalContent.innerHTML = `
                <p><strong>🔖 ${order.orderNumber}</strong> | 👤 ${order.userEmail}</p>
                <label>💵 السعر بالدولار</label>
                <input type="number" id="priceUSDInput" placeholder="السعر بالدولار" step="0.01" min="0" style="margin-bottom:10px;">
                <div id="pricePreview" class="highlight-box" style="display:none;">
                    <p>💵 بالدينار: <span id="calcIQD">—</span> د.ع (×1280)</p>
                    <p>🚚 التوصيل: <span id="calcDelivery">—</span> د.ع ${isFirstOrder?'<span style="color:var(--success);">(مجاني - أول طلب)</span>':''}</p>
                    <p>📊 المجموع: <span id="calcTotal">—</span> د.ع</p>
                    <p>🔐 العربون: <span id="calcDownPayment" style="color:var(--gold);font-size:17px;">—</span> د.ع</p>
                    <p style="font-size:10px;">الشرائح: أقل من 100,000 → 10,000 | 100,000-250,000 → 25,000 | 250,000-500,000 → 50,000 | 500,000+ → 100,000</p>
                </div>
                <button class="btn btn-gold" id="confirmPriceBtn" style="margin-top:8px;">✅ تأكيد وتحويل لبإنتظار الدفع</button>
            `;
            priceModal.style.display = 'flex';

            const priceInput = document.getElementById('priceUSDInput');
            const pricePreview = document.getElementById('pricePreview');
            priceInput.addEventListener('input', () => {
                const usd = parseFloat(priceInput.value);
                if (isNaN(usd) || usd <= 0) { pricePreview.style.display = 'none'; return; }
                pricePreview.style.display = 'block';
                const iqd = floorToThousand(usd * 1280);  // تقريب سعر الدينار لأقرب ألف
                let delivery = 3000;
                if (isFirstOrder || usd > 200) delivery = 0;
                const total = iqd + delivery;
                const downPayment = calculateDownPayment(total);
                document.getElementById('calcIQD').textContent = iqd.toLocaleString();
                document.getElementById('calcDelivery').textContent = delivery.toLocaleString();
                document.getElementById('calcTotal').textContent = total.toLocaleString();
                document.getElementById('calcDownPayment').textContent = downPayment.toLocaleString();
                document.getElementById('confirmPriceBtn').onclick = async () => {
                    await update(ref(db, 'orders/' + orderId), {
                        priceUSD: usd,
                        priceIQD: iqd,
                        deliveryFee: delivery,
                        totalIQD: total,
                        downPayment: downPayment,
                        status: 'بانتظار الدفع',
                        pricedAt: new Date().toISOString(),
                        isFirstOrder
                    });
                    priceModal.style.display = 'none';
                    showToast('✅ تم التسعير وتحويل الحالة إلى بانتظار الدفع', 'success');
                };
            });
        }
        document.getElementById('closePriceModal').addEventListener('click', () => priceModal.style.display = 'none');
        priceModal.addEventListener('click', (e) => { if (e.target === priceModal) priceModal.style.display = 'none'; });

        // ==================== EDIT ORDER MODAL (تقريب وخصم العربون) ====================
        function openEditOrderModal(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;
            const statuses = ['قيد المراجعة','بانتظار الدفع','قيد التدقيق','قيد التجهيز','قيد الشحن للكويت','قيد الشحن للعراق','تم التسليم','ملغي لان عملية تحويل الاموال غير صالحة'];
            const opts = statuses.map(s => `<option value="${s}" ${order.status===s?'selected':''}>${s}</option>`).join('');

            editOrderContent.innerHTML = `
                <p><strong>${order.orderNumber}</strong> | ${order.userEmail}</p>
                <div class="form-row">
                    <div style="flex:1;"><label>💵 السعر $</label><input type="number" id="editPriceUSD" value="${order.priceUSD||''}" step="0.01"></div>
                    <div style="flex:1;"><label>💵 السعر د.ع (مقرب)</label><input type="number" id="editPriceIQD" value="${order.priceIQD? floorToThousand(order.priceIQD) : ''}"></div>
                </div>
                <div class="form-row">
                    <div style="flex:1;"><label>🚚 التوصيل</label><input type="number" id="editDelivery" value="${order.deliveryFee||''}"></div>
                    <div style="flex:1;"><label>🔐 العربون</label><input type="number" id="editDownPayment" value="${order.downPayment||''}"></div>
                </div>
                <label>📊 الحالة</label>
                <select id="editStatus">${opts}</select>
                <p style="font-size:10px;color:var(--text3);margin-top:4px;">عند اختيار "قيد التجهيز" سيتم خصم العربون من الإجمالي (مقرباً)</p>
                <div id="remainingPreview" style="display:none; margin-top:8px; color:var(--success); font-weight:600;"></div>
                <button class="btn btn-gold" id="saveEditOrderBtn" style="margin-top:10px;">💾 حفظ التعديلات</button>
                <button class="btn btn-danger btn-sm" id="deleteOrderFromEditBtn" style="margin-top:8px;">🗑️ حذف الطلب</button>
            `;
            editOrderModal.style.display = 'flex';

            const statusSelect = document.getElementById('editStatus');
            const priceIQDInput = document.getElementById('editPriceIQD');
            const deliveryInput = document.getElementById('editDelivery');
            const downPaymentInput = document.getElementById('editDownPayment');
            const remainingPreview = document.getElementById('remainingPreview');

            function updateRemainingPreview() {
                const newStatus = statusSelect.value;
                if (newStatus === 'قيد التجهيز') {
                    const iqd = parseInt(priceIQDInput.value) || 0;
                    const delivery = parseInt(deliveryInput.value) || 0;
                    const down = parseInt(downPaymentInput.value) || 0;
                    const total = iqd + delivery;
                    if (total > 0 && down > 0) {
                        const remaining = floorToThousand(total - down);
                        remainingPreview.style.display = 'block';
                        remainingPreview.textContent = `💸 المبلغ المتبقي بعد خصم العربون: ${remaining.toLocaleString()} د.ع`;
                    } else {
                        remainingPreview.style.display = 'none';
                    }
                } else {
                    remainingPreview.style.display = 'none';
                }
            }
            statusSelect.addEventListener('change', updateRemainingPreview);
            priceIQDInput.addEventListener('input', updateRemainingPreview);
            deliveryInput.addEventListener('input', updateRemainingPreview);
            downPaymentInput.addEventListener('input', updateRemainingPreview);
            updateRemainingPreview();

            document.getElementById('saveEditOrderBtn').onclick = async () => {
                const newStatus = statusSelect.value;
                const priceUSD = parseFloat(document.getElementById('editPriceUSD').value) || null;
                const priceIQD = parseInt(priceIQDInput.value) || null;
                const deliveryFee = parseInt(deliveryInput.value) || null;
                const downPayment = parseInt(downPaymentInput.value) || null;
                const totalIQD = (priceIQD !== null && deliveryFee !== null) ? priceIQD + deliveryFee : order.totalIQD;

                const updates = {
                    priceUSD, priceIQD, deliveryFee, downPayment, totalIQD,
                    status: newStatus,
                    updatedAt: new Date().toISOString()
                };

                if (newStatus === 'قيد التجهيز' && totalIQD && downPayment) {
                    updates.remainingAmount = floorToThousand(totalIQD - downPayment);
                }

                await update(ref(db, 'orders/' + orderId), updates);
                editOrderModal.style.display = 'none';
                showToast('✅ تم تحديث الطلب', 'success');
            };

            document.getElementById('deleteOrderFromEditBtn').onclick = async () => {
                if (!confirm('حذف الطلب؟')) return;
                await remove(ref(db, 'orders/' + orderId));
                editOrderModal.style.display = 'none';
                showToast('🗑️ تم الحذف', 'success');
            };
        }
        document.getElementById('closeEditOrderModal').addEventListener('click', () => editOrderModal.style.display = 'none');
        editOrderModal.addEventListener('click', (e) => { if (e.target === editOrderModal) editOrderModal.style.display = 'none'; });

        // ==================== USERS ====================
        function renderUsers() {
            if (!allUsers.length) { usersContainer.innerHTML = '<p style="text-align:center;color:var(--text3);">لا يوجد مستخدمين</p>'; return; }
            let html = '';
            allUsers.forEach(u => {
                const isBanned = u.banned === true;
                html += `
                <div class="user-row ${isBanned?'banned-user':''}">
                    <div><strong>${u.name||'—'}</strong><div style="font-size:11px;color:var(--text3);">${u.email||'—'} | ${u.phone1||''} | طلبات: ${allOrders.filter(o=>o.userId===u.id).length}</div>${isBanned?'<span style="color:var(--danger);">🚫 محظور</span>':''}</div>
                    <div style="display:flex;gap:6px;">
                        <button class="btn btn-outline btn-sm edit-user-btn" data-id="${u.id}">✏️</button>
                        <button class="btn ${isBanned?'btn-gold':'btn-danger'} btn-sm ban-btn" data-id="${u.id}" data-ban="${!isBanned}">${isBanned?'فك الحظر':'حظر'}</button>
                    </div>
                </div>`;
            });
            usersContainer.innerHTML = html;
            usersContainer.querySelectorAll('.edit-user-btn').forEach(b => b.addEventListener('click', () => openEditUser(b.dataset.id)));
            usersContainer.querySelectorAll('.ban-btn').forEach(b => b.addEventListener('click', () => toggleBan(b.dataset.id, b.dataset.ban === 'true')));
        }
        function openEditUser(userId) {
            const u = allUsers.find(u => u.id === userId);
            if (!u) return;
            editUserContent.innerHTML = `
                <label>الاسم</label><input type="text" id="euName" value="${u.name||''}">
                <label>البريد</label><input type="email" id="euEmail" value="${u.email||''}">
                <label>هاتف 1</label><input type="tel" id="euPhone1" value="${u.phone1||''}">
                <label>هاتف 2</label><input type="tel" id="euPhone2" value="${u.phone2||''}">
                <label>المحافظة</label><input type="text" id="euProvince" value="${u.province||''}">
                <label>العنوان</label><input type="text" id="euAddress" value="${u.address||''}">
                <button class="btn btn-gold" id="saveUserBtn" style="margin-top:10px;">حفظ</button>
            `;
            editUserModal.style.display = 'flex';
            document.getElementById('saveUserBtn').onclick = async () => {
                await update(ref(db, 'users/' + userId), {
                    name: document.getElementById('euName').value.trim(),
                    email: document.getElementById('euEmail').value.trim(),
                    phone1: document.getElementById('euPhone1').value.trim(),
                    phone2: document.getElementById('euPhone2').value.trim(),
                    province: document.getElementById('euProvince').value.trim(),
                    address: document.getElementById('euAddress').value.trim()
                });
                editUserModal.style.display = 'none';
                showToast('✅ تم التحديث', 'success');
            };
        }
        document.getElementById('closeEditUserModal').addEventListener('click', () => editUserModal.style.display = 'none');
        editUserModal.addEventListener('click', (e) => { if (e.target === editUserModal) editUserModal.style.display = 'none'; });
        async function toggleBan(userId, ban) {
            if (!confirm(ban ? 'حظر المستخدم؟' : 'فك الحظر؟')) return;
            await update(ref(db, 'users/' + userId), { banned: ban });
            showToast(ban ? '🚫 تم الحظر' : '✅ تم فك الحظر', 'success');
        }

        const saved = localStorage.getItem('vndr_admin_session');
        if (saved && !currentAdmin) { setTimeout(() => { if (!currentAdmin) showAdminAuth(); }, 2000); }
        else if (!saved) showAdminAuth();
    </script>
</body>
</html>
